<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3" fill="rgba(255,255,255,0.16)"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.9"/>

  <!-- compass -->
  <g transform="translate(1240 220)">
    <circle cx="0" cy="0" r="150" fill="rgba(255,255,255,0.10)" filter="url(#blur)"/>
    <circle cx="0" cy="0" r="110" fill="rgba(255,255,255,0.16)"/>
    <circle cx="0" cy="0" r="80" fill="rgba(0,0,0,0.08)"/>
    <path d="M0 -92 26 0 0 18 -26 0Z" fill="rgba(255,255,255,0.92)"/>
    <path d="M0 92 -26 0 0 -18 26 0Z" fill="rgba(255,255,255,0.55)"/>
    <circle cx="0" cy="0" r="10" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- route curve -->
  <path d="M180 620 C 420 470, 680 520, 900 430 C 1120 340, 1240 360, 1460 240" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="620" r="10" fill="rgba(255,255,255,0.75)"/>
  <circle cx="900" cy="430" r="7" fill="rgba(255,255,255,0.45)"/>
  <circle cx="1460" cy="240" r="10" fill="rgba(255,255,255,0.75)"/>

  <rect x="0" y="620" width="1600" height="280" fill="rgba(0,0,0,0.22)"/>
</svg>
