<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.9"/>

  <!-- soft blobs -->
  <circle cx="280" cy="260" r="220" fill="rgba(255,255,255,0.18)" filter="url(#blur)"/>
  <circle cx="1280" cy="200" r="260" fill="rgba(255,255,255,0.14)" filter="url(#blur)"/>
  <circle cx="1100" cy="720" r="320" fill="rgba(255,255,255,0.12)" filter="url(#blur)"/>

  <!-- simple plane icon -->
  <g transform="translate(1160 160) rotate(18)">
    <path d="M40 0 64 24 40 32 24 56 12 52 16 36 0 28 0 18 16 14 12 -2Z" fill="rgba(255,255,255,0.92)"/>
    <path d="M-220 72 C -80 36, 40 44, 180 16" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-220" cy="72" r="8" fill="rgba(255,255,255,0.65)"/>
    <circle cx="-110" cy="52" r="6" fill="rgba(255,255,255,0.45)"/>
    <circle cx="0" cy="46" r="5" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- title shadow strip -->
  <rect x="0" y="620" width="1600" height="280" fill="rgba(0,0,0,0.22)"/>
</svg>
