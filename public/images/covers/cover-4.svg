<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="lines" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 80 L80 0" stroke="rgba(255,255,255,0.14)" stroke-width="8"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#lines)" opacity="0.9"/>

  <!-- map pin -->
  <g transform="translate(1240 240)">
    <path d="M0 -120 C 70 -120, 120 -70, 120 0 C 120 110, 0 200, 0 200 C 0 200, -120 110, -120 0 C -120 -70, -70 -120, 0 -120Z"
      fill="rgba(255,255,255,0.24)"/>
    <circle cx="0" cy="-10" r="48" fill="rgba(0,0,0,0.10)"/>
    <circle cx="0" cy="-10" r="30" fill="rgba(255,255,255,0.75)"/>
  </g>

  <rect x="0" y="620" width="1600" height="280" fill="rgba(0,0,0,0.22)"/>
</svg>
